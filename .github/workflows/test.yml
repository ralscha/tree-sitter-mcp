name: Test

on:
  push:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Run Go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"

      - name: Build and test demo
        working-directory: demos/eino-architecture-detective
        run: go test ./...
