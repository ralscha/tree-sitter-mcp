version: '3'

vars:
  BINARY: 'bin/tree-sitter-mcp{{exeExt}}'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the MCP server
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -o {{.BINARY}} .

  run:
    desc: Run the server over stdio
    deps: [build]
    cmds:
      - '{{.BINARY}}'

  demo:eino:
    desc: Run the Eino architecture detective demo (optional TARGET and FOCUS vars)
    deps: [build]
    dir: demos/eino-architecture-detective
    env:
      TREE_SITTER_MCP_BIN: '{{joinPath .ROOT_DIR .BINARY}}'
    cmds:
      - go run . --env "{{joinPath .ROOT_DIR ".env"}}" "{{default .ROOT_DIR .TARGET}}" {{if .FOCUS}}"{{.FOCUS}}"{{end}}

  debug:
    desc: Run with debug logging
    deps: [build]
    cmds:
      - '{{.BINARY}} --debug'

  preparse:
    desc: Build and pre-parse a project directory (set PREPARSE_PATH env var or pass as arg)
    deps: [build]
    cmds:
      - '{{.BINARY}} --debug --pre-parse {{default "." .PREPARSE_PATH}}'

  test:
    desc: Run tests
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test ./...

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy
      - task tidy:demo

  tidy:demo:
    desc: Tidy demo module dependencies
    dir: demos/eino-architecture-detective
    cmds:
      - go mod tidy

  format:
    desc: Format all Go source files
    cmds:
      - go fmt ./...
      - task format:demo

  format:demo:
    desc: Format demo Go source files
    dir: demos/eino-architecture-detective
    cmds:
      - go fmt ./...

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - docker run --rm -v {{toSlash .ROOT_DIR}}:/app -w /app golangci/golangci-lint:v2.13.1 golangci-lint run -v --timeout 5m

  clean:
    desc: Remove built binary
    cmds:
      - cmd /c "if exist {{.BINARY}} del /q {{.BINARY}}"

  tag:
    desc: Create a local git tag for a release
    summary: |
      Create a local git tag.

      Run with `task --interactive tag` to be prompted for TAG,
      or pass it explicitly with `task tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}

  push-tag:
    desc: Push an existing git tag to GitHub
    summary: |
      Push a git tag to the origin remote.

      Run with `task --interactive push-tag` to be prompted for TAG,
      or pass it explicitly with `task push-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 0; else exit 1; fi'
        msg: Tag does not exist locally. Run `task tag TAG=v1.0.0` first.
    cmds:
      - git push origin {{.TAG}}

  release-tag:
    desc: Create and push a release tag to GitHub
    summary: |
      Create a local git tag and push it to the origin remote.

      Run with `task --interactive release-tag` to be prompted for TAG,
      or pass it explicitly with `task release-tag TAG=v1.0.0`.
    requires:
      vars: [TAG]
    preconditions:
      - sh: 'case "{{.TAG}}" in v*) exit 0 ;; *) exit 1 ;; esac'
        msg: TAG must start with v, for example v1.0.0
      - sh: 'if git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null 2>&1; then exit 1; fi; exit 0'
        msg: Tag already exists locally
    cmds:
      - git tag {{.TAG}}
      - git push origin {{.TAG}}

